[package]
name        = "varint-nv"
version     = "0.1.0"
description = "Signed varints on a wire: the ZigZag fold and the LEB128 byte loop as one call, at 32 and 64 bits, so that -1 costs one byte instead of ten.  The pairing Protocol Buffers calls sint32 and sint64.  Encodes into a caller's buffer without allocating; malformed input is a value, never a panic."
license     = "Apache-2.0"
stability   = "experimental"
keywords    = ["varint", "zigzag", "leb128", "protobuf", "encoding"]
main        = "src/main.nv"

# The README is the package's one page, and its own first heading is the
# package name — which says nothing in a list of this package's pages.
[docs.pages]
"README.md" = "Writing and reading signed variable-length integers"

[dependencies]
# The two halves of the transform, each usable on its own.  Both ranges
# are the widest this package supports: it calls nothing either one
# added after its first release, so a consumer that already holds a
# 0.1.x of either keeps it.
leb128-nv = "^0.1.0"
zigzag-nv = "^0.1.0"
